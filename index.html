$('#g').innerHTML=`<button class="pl" id="lv">مغادرة</button><div class="pl" id="clk">5:00</div><div class="pl eyb" id="eye" onclick="eyeL()" style="right:6.8rem;display:none"></div>${S&&S.spec?'<div class="pl" style="left:50%;transform:translateX(-50%)">👁 مشاهدة</div>':''}<div id="fan"></div><div class="av" id="oav"></div><div class="np" id="onp"></div><div id="mid"><div id="cen">${ARR}<div id="disc"></div><div id="pile"><div id="halo"></div><div class="cd back stk" onclick="drw()"></div></div><div id="pill"></div><button id="ps" onclick="snd({t:'pass'})">تخطَّ</button></div></div><div id="hand"></div><div class="av" id="mav"></div><div class="np" id="mnp"></div><div id="pk"></div>`;$('#lv').onclick=leave}
function anim(){document.querySelectorAll('[data-f]').forEach(e=>{const f=$('#'+e.dataset.f).getBoundingClientRect(),r=e.getBoundingClientRect(),s=e.style;s.setProperty('--dx',f.left+f.width/2-r.left-r.width/2+'px');s.setProperty('--dy',f.top+f.height/2-r.top-r.height/2+'px');s.setProperty('--r',(Math.random()*30-15)+'deg');s.setProperty('--d',(e.dataset.d||0)+'s');e.removeAttribute('data-f');e.classList.add('fl')})}
function render(o){
const pl=!!o,m=S.h.length,n0=pl?o.h.length:0,op=S.pl[1-S.me],c0=pl?o.pl[1-o.me].c:0,st=Math.min(4.8,24.8/Math.max(1,m-1)),sp=Math.min(3.8,24.8/Math.max(1,op.c-1)),tm=S.turn===S.me,to=!tm;
$('#hand').innerHTML=S.h.map((k,i)=>{const f=!pl?i*.09:i>=n0?(i-n0)*.1:-1;return cd(k,S.spec?'back':can(i)?'':'no',`data-i="${i}" ${f>=0?`data-f="pile" data-d="${f}"`:''} style="${i?`margin-left:-${(9.2-st).toFixed(2)}rem`:''}" onclick="hp(${i},this)"`)}).join('');
$('#fan').innerHTML=Array.from({length:op.c},(_,i)=>{const f=!pl?i*.09+.045:i>=c0?(i-c0)*.1:-1;return `<div class="cd back" ${f>=0?`data-f="pile" data-d="${f}"`:''} style="${i?`margin-left:-${(9.2-sp).toFixed(2)}rem`:''}"></div>`}).join('');
$('#disc').innerHTML=cd({c:S.cur,v:S.top.v},'',!pl?'data-f="pile" data-d="1"':S.dn!==o.dn&&o.turn!==o.me?'data-f="fan"':'');
$('#oav').className='av'+(to?' on':'');$('#oav').innerHTML=img(op);
$('#onp').className='np'+(to?' on':'');$('#onp').innerHTML=`${esc(op.n)}<em>${op.c}</em><s></s>`;
$('#mav').className='av'+(tm?' on':'');$('#mav').innerHTML=img(S.spec?S.pl[0]:ME);
$('#mnp').className='np'+(tm?' on':'');$('#mnp').innerHTML=`${S.spec?esc(S.pl[0].n):'أنت'}<em>${m}</em><s></s>`;
$('#halo').style.opacity=!S.spec&&tm&&!S.drew?1:0;$('#arr').classList.toggle('rv',S.dir<0);$('#ps').style.display=!S.spec&&tm&&S.drew?'flex':'none';
{const e=$('#eye');if(e){e.style.display=S.ob?'flex':'none';e.textContent='👁 '+S.ob}}eyeR();
anim()}
function endS(){if(!S||S.ph!=='end')return;document.body.classList.add('flat');document.body.classList.remove('dng');
const w=S.win,L=S.why==='afk'||S.why==='left',ord=w>=0?[w,1-w]:[S.me,1-S.me];let fk='';if(!L){if(S.vip>=0){if(w>=0)fk=w===S.vip?'joy':'sad'}else if(w>=0&&(S.spec||w===S.me))fk='norm'}const fxm=fk==='joy'?'<div class="rays"></div><div class="stk2 win"></div>':fk==='sad'?'<div class="stk2 lose"></div>':'';fx(fk);
const row=(j,i)=>{const p=S.pl[j],wn=w>=0&&i===0;return `<div class="er ${wn?'w':''}" style="top:${i?36.2:31.5}rem"><div class="av">${img(p)}${wn?`<u><svg viewBox="0 0 24 24">${CRW}</svg></u>`:''}</div><span>${esc(p.n)}</span>${L&&w>=0&&i===1?'<small>غادر</small>':''}</div>`};
$('#g').innerHTML=`<button class="pl" id="lv">مغادرة</button><div class="end">${fxm}<svg class="cr" viewBox="0 0 24 24">${CRW}</svg><h1 style="top:24.4rem">انتهت اللعبة</h1>${row(ord[0],0)}${row(ord[1],1)}<button class="inv" style="top:41.6rem" onclick="inv()">${IV}</button><div class="il" style="top:45.4rem">دعوة<br>أصحابك</div></div>`;$('#lv').onclick=leave}
function on(s){if(s.t==='full'){dead=1;stat('الغرفة ممتلئة، اطلب رابط دعوة جديداً');return}if(s.t==='auth'){dead=1;stat('افتح اللعبة من داخل تيليجرام');return}stat('');
const o=S;S=s;S.at=Date.now();if(gh){gh.remove();gh=null}if(s.code&&!room)room=s.code;
if(s.ph==='wait')return lobby();
if(s.ph==='end'){if(!o||o.ph!=='end')setTimeout(endS,o&&o.ph==='play'?800:0);return}
if(!o||o.ph!=='play')build();render(o&&o.ph==='play'?o:null)}
function pick(f){const P=[['r',0,-6.3],['y',6.3,0],['b',0,6.3],['g',-6.3,0]];
$('#pk').innerHTML='<div class="pkb"></div>'+P.map(([k,x,y])=>`<button class="pt" style="background:${HX[k]};transform:translate(-50%,-50%) translate(${x}rem,${y}rem) rotate(45deg)" onclick="pc('${k}')"></button>`).join('');
window.pc=c=>{$('#pk').style.display='none';f(c)};$('#pk').style.display='block'}
function mkg(el){const r=el.getBoundingClientRect(),g=el.cloneNode(true);g.classList.remove('no','fl');g.removeAttribute('onclick');g.style.cssText=`position:fixed;left:${r.left}px;top:${r.top}px;margin:0;z-index:50;pointer-events:none;transition:none;box-shadow:0 1.4rem 2.6rem #000b;will-change:transform`;document.body.appendChild(g);el.style.opacity=0;return{g,r}}
const pose=(g,x,y,s,a)=>g.style.transform=`translate(${x}px,${y}px) scale(${s}) rotate(${a}deg)`;
function target(r){const t=$('#disc').getBoundingClientRect();return{x:t.left+t.width/2-r.left-r.width/2,y:t.top+t.height/2-r.top-r.height/2,s:t.width/r.width}}
function land(p,x,y,s,a){const t=target(p.r);p.g.animate([{transform:`translate(${x}px,${y}px) scale(${s}) rotate(${a}deg)`},{transform:`translate(${t.x}px,${t.y}px) scale(${t.s}) rotate(0deg)`}],{duration:340,easing:'cubic-bezier(.2,.8,.25,1)',fill:'forwards'})}
function back(p,x,y,s,a,el){const an=p.g.animate([{transform:`translate(${x}px,${y}px) scale(${s}) rotate(${a}deg)`},{transform:'translate(0,0) scale(1) rotate(0deg)'}],{duration:420,easing:'cubic-bezier(.2,1.15,.3,1)',fill:'forwards'});an.onfinish=()=>{p.g.remove();el.style.opacity=''}}
function commit(i,p,x=0,y=0,s=1,a=0){gh=p.g;land(p,x,y,s,a);const k=S.h[i];if(k.c==='w')setTimeout(()=>pick(c=>snd({t:'play',i,c})),340);else snd({t:'play',i});
setTimeout(()=>{if(gh===p.g){gh.remove();gh=null;document.querySelectorAll('#hand .cd').forEach(e=>e.style.opacity='')}},2500)}
function hp(i,el){if(sup||!can(i))return;hap();commit(i,mkg(el))}
function go(d){const t=target(d.p.r),D=Math.hypot(t.x,t.y)||1,pr=(d.tx*t.x+d.ty*t.y)/D,fr=performance.now()-d.t<90,vp=fr?(d.vx*t.x+d.vy*t.y)/D:0;return pr>D*.28||(vp>.55&&pr>24)}
let LP={x:0,y:0,s:1,a:0};
function loop(){if(!dg||!dg.on)return;const d=dg;LP.x+=(d.tx-LP.x)*.38;LP.y+=(d.ty-LP.y)*.38;LP.s+=(1.22-LP.s)*.22;LP.a+=(Math.max(-14,Math.min(14,d.vx*16))-LP.a)*.2;pose(d.p.g,LP.x,LP.y,LP.s,LP.a);requestAnimationFrame(loop)}
$('#g').addEventListener('pointerdown',e=>{const el=e.target.closest('#hand .cd:not(.no)');if(!el||dg||!mine())return;dg={el,i:+el.dataset.i,x:e.clientX,y:e.clientY,on:false,id:e.pointerId,tx:0,ty:0,vx:0,vy:0,t:0}});
addEventListener('pointermove',e=>{if(!dg||e.pointerId!==dg.id)return;if(!dg.el.isConnected){dg.p&&dg.p.g.remove();dg=null;return}
const dx=e.clientX-dg.x,dy=e.clientY-dg.y;
if(!dg.on){if(Math.hypot(dx,dy)<6)return;dg.on=true;dg.p=mkg(dg.el);LP={x:0,y:0,s:1,a:0};hap();dg.t=performance.now();requestAnimationFrame(loop)}
const n=performance.now(),dt=Math.max(1,n-dg.t);dg.vx=(dx-dg.tx)/dt;dg.vy=(dy-dg.ty)/dt;dg.t=n;dg.tx=dx;dg.ty=dy;
$('#disc').classList.toggle('hot',go(dg))});
function dEnd(e,cx){if(!dg||e.pointerId!==dg.id)return;const d=dg;dg=null;if(!d.on)return;sup=true;setTimeout(()=>sup=false,60);$('#disc').classList.remove('hot');const p=d.p,L=LP;
if(!cx&&can(d.i)&&go(d))commit(d.i,p,L.x,L.y,L.s,L.a);else back(p,L.x,L.y,L.s,L.a,d.el)}
addEventListener('pointerup',e=>dEnd(e,false));addEventListener('pointercancel',e=>dEnd(e,true));
setInterval(()=>{if(!S||S.ph!=='play')return;const dt=Date.now()-S.at,g=Math.max(0,S.gl-dt),r=Math.ceil(Math.max(0,S.tl-dt)/1000),m=!S.spec&&S.turn===S.me,p=$('#pill');if(!p)return;
$('#clk').textContent=Math.floor(g/60000)+':'+String(Math.floor(g/1000)%60).padStart(2,'0');
p.className=m?(r<=5?'am':'bl'):'';p.textContent=m?'دورك دلوقتي'+(r<=5?' · '+r:''):'الدور على '+S.pl[S.spec?S.turn:1-S.me].n+(r<=5?' · '+r:'');
document.body.classList.toggle('dng',!S.spec&&!m&&r<=5)},250);
lobby();
let tries=0,dead=0;
function stat(t){let e=$('.dcn');if(!t){e&&e.remove();return}if(!e){e=document.createElement('div');e.className='dcn';document.body.appendChild(e)}e.textContent=t}
function connect(){ws=new WebSocket(SERVER);
ws.onopen=()=>{tries=0;snd({t:'join',room:(S&&S.code)||room,id:ME.id,name:ME.n,pic:ME.pic,init:(T&&T.initData)||''})};
ws.onmessage=e=>on(JSON.parse(e.data));
ws.onclose=()=>{if(dead||(S&&S.ph==='end'))return;tries++;stat(tries>1?'جاري إعادة الاتصال...':'جاري الاتصال... قد يستغرق دقيقة');setTimeout(connect,Math.min(1000*tries,4000))}}
connect();
function keep(){try{snd({t:'ping'});fetch(SERVER.replace(/^ws/,'http')+'/health',{mode:'no-cors',cache:'no-store'}).catch(()=>{})}catch(e){}}
setInterval(keep,240000);
</script>
